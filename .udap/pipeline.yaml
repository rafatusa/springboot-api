version: 1
name: springboot-api
vcs: github

rollback:
  strategy: manual

# =============================================================================
# springboot-api CI/CD Pipeline — Two-Repo Enterprise Pattern
#
# Repo 1 (this): springboot-api  — app source, IaC, Ansible, cicd-template/
# Repo 2:  springboot-cicd-template — all 12 enterprise CI/CD stages
#
# The provision stage:
#   1. Creates springboot-cicd-template repo if it doesn't exist
#   2. Syncs cicd-template/ into it (so the template repo is always current)
#   3. Dispatches the full 12-stage enterprise pipeline via GitHub API
#   4. Polls until completion
# =============================================================================

stages:
  # ---------------------------------------------------------------------------
  # provision: bootstrap template repo, dispatch enterprise pipeline, poll
  # ---------------------------------------------------------------------------
  - id: provision
    kind: provision
    needs: []
    timeout_minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_region: us-east-1

    steps:
      - name: Bootstrap and sync springboot-cicd-template repo
        env:
          GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TEMPLATE_REPO="${REPO_OWNER}/springboot-cicd-template"
          echo "=== Bootstrap: $TEMPLATE_REPO ==="

          # Create repo if it does not exist
          if ! gh api "/repos/${TEMPLATE_REPO}" --silent 2>/dev/null; then
            echo "Creating $TEMPLATE_REPO ..."
            gh api --method POST /user/repos \
              -f name=springboot-cicd-template \
              -f description="Enterprise reusable CI/CD pipeline for Spring Boot apps" \
              -F private=false \
              -F auto_init=true
            echo "Waiting 15s for GitHub to initialise repo..."
            sleep 15
          else
            echo "Repo $TEMPLATE_REPO already exists."
          fi

          # Clone the template repo and sync cicd-template/ into it
          TMPDIR=$(mktemp -d)
          git clone "https://${GH_TOKEN}@github.com/${TEMPLATE_REPO}.git" "$TMPDIR"
          mkdir -p "$TMPDIR/.github/workflows"

          cp cicd-template/.github/workflows/enterprise-pipeline.yml \
             "$TMPDIR/.github/workflows/enterprise-pipeline.yml"
          cp cicd-template/README.md "$TMPDIR/README.md"

          cd "$TMPDIR"
          git config user.email "cicd-bootstrap@springboot-api"
          git config user.name "springboot-api CI"
          git add -A

          if git diff --cached --quiet; then
            echo "Template repo already up to date — no commit needed."
          else
            git commit -m "chore: sync enterprise pipeline from springboot-api@${{ github.sha }}"
            git push origin main
            echo "Template repo updated."
          fi

      - name: Dispatch enterprise pipeline to springboot-cicd-template
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
          APP_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "=== Two-Repo Enterprise CI/CD Pattern ==="
          echo "App repo  : $APP_REPO"
          echo "Template  : ${REPO_OWNER}/springboot-cicd-template"
          echo "Commit SHA: $COMMIT_SHA"

          # Brief pause to ensure workflow file is indexed by GitHub after sync
          sleep 10

          HTTP_STATUS=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO_OWNER}/springboot-cicd-template/actions/workflows/enterprise-pipeline.yml/dispatches" \
            -f ref=main \
            -f "inputs[app_repo]=${APP_REPO}" \
            -f "inputs[app_ref]=${COMMIT_SHA}" \
            -f "inputs[java_version]=17" \
            -f "inputs[image_name]=${REPO_OWNER}/springboot-api" \
            -f "inputs[aws_region]=us-east-1" \
            -f "inputs[instance_type]=t3.small" \
            -f "inputs[health_endpoint]=/actuator/health" \
            -f "inputs[run_perf_tests]=true" \
            -f "inputs[owasp_cvss_threshold]=9" \
            --silent -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")

          echo "Dispatch HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Enterprise pipeline dispatched successfully."
          else
            echo "::error::Dispatch failed (HTTP $HTTP_STATUS). Check CICD_TEMPLATE_TOKEN has actions:write on springboot-cicd-template."
            exit 1
          fi

          echo "dispatch_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Poll enterprise pipeline to completion
        env:
          GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "Waiting 45s for dispatched run to appear in GitHub..."
          sleep 45

          MAX_WAIT=5400
          WAITED=0
          INTERVAL=30

          while [ "$WAITED" -lt "$MAX_WAIT" ]; do
            RUN_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO_OWNER}/springboot-cicd-template/actions/workflows/enterprise-pipeline.yml/runs?per_page=1" \
              2>/dev/null || echo '{"workflow_runs":[]}')

            STATUS=$(echo "$RUN_JSON" | python3 -c \
              "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['status'] if r else 'none')" 2>/dev/null || echo "none")
            CONCLUSION=$(echo "$RUN_JSON" | python3 -c \
              "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['conclusion'] or 'pending' if r else 'none')" 2>/dev/null || echo "none")
            RUN_URL=$(echo "$RUN_JSON" | python3 -c \
              "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['html_url'] if r else '')" 2>/dev/null || echo "")

            echo "[${WAITED}s] status=${STATUS} conclusion=${CONCLUSION} url=${RUN_URL}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Enterprise pipeline SUCCEEDED: $RUN_URL"
                exit 0
              else
                echo "::error::Enterprise pipeline FAILED (conclusion=${CONCLUSION}): $RUN_URL"
                exit 1
              fi
            fi

            sleep "$INTERVAL"
            WAITED=$((WAITED + INTERVAL))
          done

          echo "::error::Timeout: enterprise pipeline did not complete within ${MAX_WAIT}s"
          exit 1

  # ---------------------------------------------------------------------------
  # configure: no-op — all configuration executed inside enterprise-pipeline.yml
  # ---------------------------------------------------------------------------
  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 5
    steps:
      - name: Configure complete — handled by enterprise-pipeline.yml
        run: |
          echo "All configuration (Docker, nginx, app container) was performed"
          echo "by ansible-configure stage inside springboot-cicd-template."
          echo "This stage satisfies the platform provision -> configure -> verify backbone."

  # ---------------------------------------------------------------------------
  # verify: re-read terraform state → confirm health endpoint is UP
  # ---------------------------------------------------------------------------
  - id: verify
    kind: verify
    needs: [configure, provision]
    timeout_minutes: 10
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (read state)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra

      - name: Get instance IP from terraform output
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Final health check with retries
        run: |
          echo "Confirming app health after full enterprise pipeline run..."
          curl --fail --retry 12 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.instance_ip }}/actuator/health

destroy:
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
      working-directory: infra
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
