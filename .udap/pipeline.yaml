version: 1
name: springboot-api
vcs: github

rollback:
  strategy: manual

# =============================================================================
# springboot-api CI/CD Pipeline — Two-Repo Enterprise Pattern
#
# Repo 1 (this): springboot-api  — app source, IaC, Ansible
# Repo 2:  springboot-cicd-template — all 12 enterprise CI/CD stages
#
# deploy.yml does THREE things:
#   1. provision: Ensures template repo exists (creates + pushes if needed),
#      then dispatches the full 12-stage enterprise pipeline via GitHub API,
#      then polls until it completes.
#   2. configure: No-op (config handled inside enterprise pipeline)
#   3. verify: Re-reads terraform output → final health check
# =============================================================================

stages:
  # ---------------------------------------------------------------------------
  # provision: bootstrap template repo, dispatch enterprise pipeline, poll
  # ---------------------------------------------------------------------------
  - id: provision
    kind: provision
    needs: []
    timeout_minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_region: us-east-1
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap springboot-cicd-template repo (create if not exists)
        env:
          GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "=== Bootstrapping springboot-cicd-template repo ==="

          # Check if template repo already exists
          EXISTS=$(gh api "/repos/${REPO_OWNER}/springboot-cicd-template" \
            --silent 2>/dev/null && echo "yes" || echo "no")

          if [ "$EXISTS" = "yes" ]; then
            echo "Template repo already exists — skipping creation."
          else
            echo "Creating springboot-cicd-template repo..."
            gh api --method POST /user/repos \
              -f name=springboot-cicd-template \
              -f description="Enterprise reusable CI/CD pipeline for Spring Boot apps" \
              -f private=false \
              -f auto_init=true
            echo "Repo created. Waiting for GitHub to initialise it..."
            sleep 10
          fi

          # Push the enterprise-pipeline.yml into the template repo
          echo "Pushing enterprise-pipeline.yml to template repo..."
          TMPDIR=$(mktemp -d)
          git clone "https://${GH_TOKEN}@github.com/${REPO_OWNER}/springboot-cicd-template.git" "$TMPDIR"

          mkdir -p "$TMPDIR/.github/workflows"
          cp cicd-template/.github/workflows/enterprise-pipeline.yml \
             "$TMPDIR/.github/workflows/enterprise-pipeline.yml"
          cp cicd-template/README.md "$TMPDIR/README.md"

          cd "$TMPDIR"
          git config user.email "cicd-bootstrap@springboot-api"
          git config user.name "springboot-api CI"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to template repo — already up to date."
          else
            git commit -m "chore: update enterprise pipeline from springboot-api@${{ github.sha }}"
            git push origin main
            echo "Template repo updated."
          fi

      - name: Dispatch enterprise pipeline in springboot-cicd-template
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
          APP_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "=== Two-Repo Enterprise CI/CD Pattern ==="
          echo "App repo  : $APP_REPO"
          echo "Template  : ${REPO_OWNER}/springboot-cicd-template"
          echo "Commit SHA: $COMMIT_SHA"
          echo ""
          echo "Dispatching enterprise pipeline..."

          RESPONSE=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO_OWNER}/springboot-cicd-template/actions/workflows/enterprise-pipeline.yml/dispatches" \
            -f ref=main \
            -f "inputs[app_repo]=${APP_REPO}" \
            -f "inputs[app_ref]=${COMMIT_SHA}" \
            -f "inputs[java_version]=17" \
            -f "inputs[image_name]=${REPO_OWNER}/springboot-api" \
            -f "inputs[aws_region]=us-east-1" \
            -f "inputs[instance_type]=t3.small" \
            -f "inputs[health_endpoint]=/actuator/health" \
            -f "inputs[run_perf_tests]=true" \
            -f "inputs[owasp_cvss_threshold]=9" \
            --include 2>&1 || true)

          HTTP_STATUS=$(echo "$RESPONSE" | head -1 | grep -oP '\d{3}' | head -1)
          echo "API response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Enterprise pipeline dispatched successfully."
          else
            echo "Dispatch response: $RESPONSE"
            echo "::error::Failed to dispatch enterprise pipeline. Check CICD_TEMPLATE_TOKEN permissions."
            exit 1
          fi

          echo "dispatch_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Poll enterprise pipeline to completion
        env:
          GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "Waiting 45s for dispatched run to register in GitHub..."
          sleep 45

          MAX_WAIT=5400
          WAITED=0
          INTERVAL=30

          echo "Polling springboot-cicd-template/actions/workflows/enterprise-pipeline.yml/runs ..."

          while [ $WAITED -lt $MAX_WAIT ]; do
            RUN_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO_OWNER}/springboot-cicd-template/actions/workflows/enterprise-pipeline.yml/runs?per_page=1" \
              2>/dev/null || echo '{"workflow_runs":[]}')

            STATUS=$(echo "$RUN_JSON"   | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['status'] if r else 'none')" 2>/dev/null || echo "none")
            CONCLUSION=$(echo "$RUN_JSON" | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['conclusion'] or 'pending' if r else 'none')" 2>/dev/null || echo "none")
            RUN_URL=$(echo "$RUN_JSON"   | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['html_url'] if r else '')" 2>/dev/null || echo "")

            echo "[${WAITED}s] status=${STATUS} conclusion=${CONCLUSION}"
            [ -n "$RUN_URL" ] && echo "       url=${RUN_URL}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo ""
                echo "Enterprise pipeline SUCCEEDED: $RUN_URL"
                exit 0
              else
                echo ""
                echo "::error::Enterprise pipeline FAILED (conclusion=${CONCLUSION})"
                echo "See template repo run for details: $RUN_URL"
                exit 1
              fi
            fi

            sleep $INTERVAL
            WAITED=$((WAITED + INTERVAL))
          done

          echo "::error::Timeout: enterprise pipeline did not complete within ${MAX_WAIT}s"
          exit 1

  # ---------------------------------------------------------------------------
  # configure: no-op — all configuration executed inside enterprise-pipeline.yml
  # ---------------------------------------------------------------------------
  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 5
    steps:
      - name: "Configure complete — executed by enterprise-pipeline.yml"
        run: |
          echo "All configuration (Docker install, nginx setup, app container)"
          echo "was performed by ansible-configure stage in springboot-cicd-template."
          echo "This stage satisfies the platform provision → configure → verify backbone."

  # ---------------------------------------------------------------------------
  # verify: re-read terraform state → confirm health endpoint is UP
  # ---------------------------------------------------------------------------
  - id: verify
    kind: verify
    needs: [configure, provision]
    timeout_minutes: 10
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init (read state)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Get instance IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Final health check
        run: |
          echo "Confirming app health after full enterprise pipeline run..."
          curl --fail --retry 12 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.instance_ip }}/actuator/health

destroy:
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
      working-directory: infra
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
