version: 1
name: springboot-api
vcs: github

rollback:
  strategy: manual

# =============================================================================
# TWO-REPO ARCHITECTURE
#
# Repo 1 (THIS): springboot-api
#   - deploy.yml   : platform backbone (provision → configure → verify)
#   - enterprise-ci.yml : THIN CALLER → calls template repo via workflow_call
#
# Repo 2: rafatusa/springboot-cicd-template
#   - enterprise-pipeline.yml : ALL 12 stages as on: workflow_call
#
# HOW IT WORKS:
#   Every push to main triggers enterprise-ci.yml which calls:
#     uses: rafatusa/springboot-cicd-template/.github/workflows/enterprise-pipeline.yml@main
#     secrets: inherit
#   The platform backbone (deploy.yml) handles infra provisioning independently.
# =============================================================================

stages:
  # ---------------------------------------------------------------------------
  # provision: Terraform — EC2 + EIP + SG + IAM
  # ---------------------------------------------------------------------------
  - id: provision
    kind: provision
    needs: []
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_region: us-east-1
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra

  # ---------------------------------------------------------------------------
  # configure: Ansible — Docker, nginx, app container
  # ---------------------------------------------------------------------------
  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 30
    steps:
      - name: Install Ansible
        run: pip install ansible-core

      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Get instance IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Scan host keys
        run: ssh-keyscan -H "${{ steps.get_ip.outputs.instance_ip }}" >> ~/.ssh/known_hosts

      - name: Generate Ansible inventory
        run: |
          cat > ansible/inventory.ini <<EOF
          [app]
          ${{ steps.get_ip.outputs.instance_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key
          EOF

      - name: Run Ansible playbook
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/site.yml \
            -e "image_tag=$IMAGE_TAG" \
            -e "github_actor=${{ github.actor }}" \
            -e "github_token=${{ github.token }}" \
            -e "project_name=${{ secrets.PROJECT_NAME }}"

  # ---------------------------------------------------------------------------
  # verify: health check with retries
  # ---------------------------------------------------------------------------
  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 10
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Get instance IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Health check with retries
        run: |
          curl --fail --retry 12 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.instance_ip }}/actuator/health

destroy:
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
      working-directory: infra
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra

# =============================================================================
# enterprise-ci.yml — THE THIN CALLER WORKFLOW
#
# This is rendered as .github/workflows/enterprise-ci.yml
# It calls the template repo's reusable workflow via workflow_call.
# The platform renders this as workflow_dispatch; on: push is added
# via the bootstrap step so it triggers on every push to main.
#
# ACTUAL workflow_call invocation (what enterprise-ci.yml does):
#   jobs:
#     enterprise:
#       uses: rafatusa/springboot-cicd-template/.github/workflows/enterprise-pipeline.yml@main
#       with: { image_name, java_version, aws_region, ... }
#       secrets: inherit
#
# The provision step below bootstraps the template repo AND writes the
# correct enterprise-ci.yml with job-level uses: + secrets: inherit
# directly to the springboot-api repo via the GitHub API.
# =============================================================================
pipelines:
  - id: enterprise-ci
    stages:
      - id: bootstrap-template
        kind: custom
        needs: []
        timeout_minutes: 15
        env:
          GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
        steps:
          - name: Push springboot-cicd-template repo and patch enterprise-ci.yml
            env:
              REPO_OWNER: ${{ github.repository_owner }}
              COMMIT_SHA: ${{ github.sha }}
            run: |
              set -euo pipefail

              TEMPLATE_REPO="${REPO_OWNER}/springboot-cicd-template"
              echo "=== Step 1: Ensure template repo exists ==="
              if gh api "/repos/${TEMPLATE_REPO}" --silent 2>/dev/null; then
                echo "Template repo already exists."
              else
                echo "Creating ${TEMPLATE_REPO}..."
                gh api --method POST /user/repos \
                  -f name=springboot-cicd-template \
                  -f description="Enterprise reusable GitHub Actions CI/CD pipeline for Spring Boot" \
                  -F private=false \
                  -F auto_init=true
                sleep 20
              fi

              echo "=== Step 2: Sync enterprise-pipeline.yml to template repo ==="
              TMPDIR=$(mktemp -d)
              git clone "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATE_REPO}.git" "$TMPDIR/template"
              mkdir -p "$TMPDIR/template/.github/workflows"
              cp cicd-template/.github/workflows/enterprise-pipeline.yml \
                 "$TMPDIR/template/.github/workflows/enterprise-pipeline.yml"
              cp cicd-template/README.md "$TMPDIR/template/README.md" 2>/dev/null || true
              cd "$TMPDIR/template"
              git config user.email "ci@springboot-api"
              git config user.name "springboot-api CI"
              git add -A
              if git diff --cached --quiet; then
                echo "Template repo up to date."
              else
                git commit -m "sync: enterprise-pipeline.yml from springboot-api@${COMMIT_SHA:0:8}"
                git push origin main
                echo "Template repo updated."
                sleep 10
              fi

              echo "=== Step 3: Patch springboot-api enterprise-ci.yml ==="
              APPDIR=$(mktemp -d)
              git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO_OWNER}/springboot-api.git" "$APPDIR/app"
              mkdir -p "$APPDIR/app/.github/workflows"

              cat > "$APPDIR/app/.github/workflows/enterprise-ci.yml" <<'WORKFLOW'
              # springboot-api — Enterprise CI/CD Caller
              # Calls the reusable workflow in springboot-cicd-template.
              # ALL 12 stages run inside the template repo's workflow.
              # secrets: inherit passes every secret automatically.
              name: enterprise-ci

              on:
                push:
                  branches: [main]
                workflow_dispatch: {}

              jobs:
                enterprise:
                  name: "Enterprise CI/CD — 12 stages (via springboot-cicd-template)"
                  uses: rafatusa/springboot-cicd-template/.github/workflows/enterprise-pipeline.yml@main
                  with:
                    image_name: "rafatusa/springboot-api"
                    java_version: "17"
                    aws_region: "us-east-1"
                    instance_type: "t3.small"
                    health_endpoint: "/actuator/health"
                    run_perf_tests: true
                    owasp_cvss_threshold: "9"
                  secrets: inherit
              WORKFLOW

              cd "$APPDIR/app"
              git config user.email "ci@springboot-api"
              git config user.name "springboot-api CI"
              git add .github/workflows/enterprise-ci.yml
              if git diff --cached --quiet; then
                echo "enterprise-ci.yml already correct — no patch needed."
              else
                git commit -m "ci: wire enterprise-ci.yml to use springboot-cicd-template reusable workflow"
                git push origin main
                echo "enterprise-ci.yml patched and pushed to springboot-api."
              fi

              echo "=== Bootstrap complete ==="
              echo "Template repo  : https://github.com/${TEMPLATE_REPO}"
              echo "Caller workflow: https://github.com/${REPO_OWNER}/springboot-api/blob/main/.github/workflows/enterprise-ci.yml"
