        \ pipeline FAILED (conclusion=${CONCLUSION})\"\n      echo \"See template\
        \ repo run for details: $RUN_URL\"\n      exit 1\n    fi\n  fi\n\n  sleep\
        \ $INTERVAL\n  WAITED=$((WAITED + INTERVAL))\ndone\n\necho \"::error::Timeout:\
        \ enterprise pipeline did not complete within ${MAX_WAIT}s\"\nexit 1\n"
      env:
        GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
        REPO_OWNER: ${{ github.repository_owner }}
  configure:
