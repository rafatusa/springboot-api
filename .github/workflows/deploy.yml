    - name: Bootstrap springboot-cicd-template repo (create if not exists)
      run: "echo \"=== Bootstrapping springboot-cicd-template repo ===\"\n\n# Check\
        \ if template repo already exists\nEXISTS=$(gh api \"/repos/${REPO_OWNER}/springboot-cicd-template\"\
        \ \\\n  --silent 2>/dev/null && echo \"yes\" || echo \"no\")\n\nif [ \"$EXISTS\"\
        \ = \"yes\" ]; then\n  echo \"Template repo already exists \u2014 skipping\
        \ creation.\"\nelse\n  echo \"Creating springboot-cicd-template repo...\"\n\
        \  gh api --method POST /user/repos \\\n    -f name=springboot-cicd-template\
        \ \\\n    -f description=\"Enterprise reusable CI/CD pipeline for Spring Boot\
        \ apps\" \\\n    -f private=false \\\n    -f auto_init=true\n  echo \"Repo\
        \ created. Waiting for GitHub to initialise it...\"\n  sleep 10\nfi\n\n# Push\
        \ the enterprise-pipeline.yml into the template repo\necho \"Pushing enterprise-pipeline.yml\
        \ to template repo...\"\nTMPDIR=$(mktemp -d)\ngit clone \"https://${GH_TOKEN}@github.com/${REPO_OWNER}/springboot-cicd-template.git\"\
        \ \"$TMPDIR\"\n\nmkdir -p \"$TMPDIR/.github/workflows\"\ncp cicd-template/.github/workflows/enterprise-pipeline.yml\
        \ \\\n   \"$TMPDIR/.github/workflows/enterprise-pipeline.yml\"\ncp cicd-template/README.md\
        \ \"$TMPDIR/README.md\"\n\ncd \"$TMPDIR\"\ngit config user.email \"cicd-bootstrap@springboot-api\"\
        \ngit config user.name \"springboot-api CI\"\n\ngit add -A\nif git diff --cached\
        \ --quiet; then\n  echo \"No changes to template repo \u2014 already up to\
        \ date.\"\nelse\n  git commit -m \"chore: update enterprise pipeline from\
        \ springboot-api@${{ github.sha }}\"\n  git push origin main\n  echo \"Template\
        \ repo updated.\"\nfi\n"
      env:
        GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
        REPO_OWNER: ${{ github.repository_owner }}
    - id: dispatch
      name: Dispatch enterprise pipeline in springboot-cicd-template
      run: "echo \"=== Two-Repo Enterprise CI/CD Pattern ===\"\necho \"App repo  :\
        \ $APP_REPO\"\necho \"Template  : ${REPO_OWNER}/springboot-cicd-template\"\
        \necho \"Commit SHA: $COMMIT_SHA\"\necho \"\"\necho \"Dispatching enterprise\
