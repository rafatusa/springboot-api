        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
    - id: get_ip
      name: Get instance IP
      run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
    - name: Health check
      run: "curl --fail --retry 15 --retry-delay 20 --retry-all-errors \\\n  http://${{\
        \ steps.get_ip.outputs.instance_ip }}/actuator/health\n"
  e2e:
    runs-on: ubuntu-latest
    needs:
    - verify
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init (read outputs)
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
    - id: get_ip
      name: Get instance IP
      run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
    - name: Run smoke tests
      run: 'BASE="http://${{ steps.get_ip.outputs.instance_ip }}"

        echo "Testing root endpoint..."

        curl --fail "$BASE/"

        echo "Testing health endpoint..."

        curl --fail "$BASE/actuator/health"

        echo "Testing API info..."

        curl --fail "$BASE/actuator/info"

        echo "Testing items list..."

        curl --fail "$BASE/api/v1/items"

        echo "All smoke tests passed."

        '
  perf:
    runs-on: ubuntu-latest
    needs:
    - e2e
    timeout-minutes: 20
    steps:
