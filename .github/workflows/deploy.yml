      run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
    - name: Final health check
      run: "echo \"Confirming app health after full enterprise pipeline run...\"\n\
        curl --fail --retry 12 --retry-delay 15 --retry-all-errors \\\n  http://${{\
        \ steps.get_ip.outputs.instance_ip }}/actuator/health\n"
