        \n  echo \"::error::Failed to dispatch enterprise pipeline. Check CICD_TEMPLATE_TOKEN\
        \ permissions.\"\n  exit 1\nfi\n\necho \"dispatch_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
      env:
        GH_TOKEN: ${{ secrets.CICD_TEMPLATE_TOKEN }}
        APP_REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        REPO_OWNER: ${{ github.repository_owner }}
    - name: Poll enterprise pipeline to completion
      run: "echo \"Waiting 45s for dispatched run to register in GitHub...\"\nsleep\
        \ 45\n\nMAX_WAIT=5400\nWAITED=0\nINTERVAL=30\n\necho \"Polling springboot-cicd-template/actions/workflows/enterprise-pipeline.yml/runs\
        \ ...\"\n\nwhile [ $WAITED -lt $MAX_WAIT ]; do\n  RUN_JSON=$(gh api \\\n \
        \   -H \"Accept: application/vnd.github+json\" \\\n    \"/repos/${REPO_OWNER}/springboot-cicd-template/actions/workflows/enterprise-pipeline.yml/runs?per_page=1\"\
        \ \\\n    2>/dev/null || echo '{\"workflow_runs\":[]}')\n\n  STATUS=$(echo\
        \ \"$RUN_JSON\"   | python3 -c \"import sys,json; r=json.load(sys.stdin)['workflow_runs'];\
        \ print(r[0]['status'] if r else 'none')\" 2>/dev/null || echo \"none\")\n\
        \  CONCLUSION=$(echo \"$RUN_JSON\" | python3 -c \"import sys,json; r=json.load(sys.stdin)['workflow_runs'];\
        \ print(r[0]['conclusion'] or 'pending' if r else 'none')\" 2>/dev/null ||\
        \ echo \"none\")\n  RUN_URL=$(echo \"$RUN_JSON\"   | python3 -c \"import sys,json;\
        \ r=json.load(sys.stdin)['workflow_runs']; print(r[0]['html_url'] if r else\
        \ '')\" 2>/dev/null || echo \"\")\n\n  echo \"[${WAITED}s] status=${STATUS}\
        \ conclusion=${CONCLUSION}\"\n  [ -n \"$RUN_URL\" ] && echo \"       url=${RUN_URL}\"\
        \n\n  if [ \"$STATUS\" = \"completed\" ]; then\n    if [ \"$CONCLUSION\" =\
