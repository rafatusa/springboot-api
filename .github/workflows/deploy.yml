name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
    - name: Checkstyle lint
      run: mvn -B checkstyle:check --no-transfer-progress
    - name: SpotBugs static analysis
      run: mvn -B spotbugs:check --no-transfer-progress
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
    - name: Run unit tests
      run: mvn -B test --no-transfer-progress
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: target/surefire-reports/
  security:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
    - name: OWASP dependency check
      run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9 --no-transfer-progress
    - name: Upload OWASP report
      uses: actions/upload-artifact@v4
      with:
        name: owasp-report
        path: target/dependency-check-report.html
  build:
    runs-on: ubuntu-latest
    needs:
    - test
    - security
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
    - name: Build JAR
      run: mvn -B package -DskipTests --no-transfer-progress
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
  build_push:
    runs-on: ubuntu-latest
    needs:
    - build
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: 'ghcr.io/${{ github.repository_owner }}/springboot-api:${{ github.sha
          }}

          ghcr.io/${{ github.repository_owner }}/springboot-api:latest

          '
        cache-from: type=gha
        cache-to: type=gha,mode=max
  provision:
    runs-on: ubuntu-latest
    needs:
    - build_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_region: us-east-1
    timeout-minutes: 30
    outputs:
      instance_ip: ${{ steps.tf_output.outputs.instance_ip }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform validate
      run: terraform validate
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -auto-approve
      working-directory: infra
    - id: tf_output
      name: Get instance IP
      run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install Ansible
      run: pip install ansible-core
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Scan host keys
      run: ssh-keyscan -H "${{ needs.provision.outputs.instance_ip }}" >> ~/.ssh/known_hosts
    - name: Generate inventory
      run: 'cat > ansible/inventory.ini <<EOF

        [app]

        ${{ needs.provision.outputs.instance_ip }} ansible_user=${{ secrets.SSH_USER
        }} ansible_ssh_private_key_file=~/.ssh/deploy_key

        EOF

        '
    - name: Run Ansible playbook
      run: "ansible-playbook -i ansible/inventory.ini ansible/site.yml \\\n  -e \"\
        image_tag=$IMAGE_TAG\" \\\n  -e \"github_actor=$GITHUB_ACTOR\" \\\n  -e \"\
        github_token=$GITHUB_TOKEN\" \\\n  -e \"project_name=${{ secrets.PROJECT_NAME\
        \ }}\"\n"
      env:
        IMAGE_TAG: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  verify:
    runs-on: ubuntu-latest
    needs:
