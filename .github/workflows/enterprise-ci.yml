# springboot-api — Enterprise CI/CD Caller
# ─────────────────────────────────────────────────────────────────────────────
# This workflow calls the REUSABLE WORKFLOW in rafatusa/springboot-cicd-template.
# ALL 12 stages run inside the template repo's workflow runners.
# secrets: inherit automatically passes every secret from THIS repo to the
# template workflow — no PAT, no cross-repo credential hacks needed.
# ─────────────────────────────────────────────────────────────────────────────
name: enterprise-ci

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  enterprise:
    name: "Enterprise CI/CD — 12 stages (via springboot-cicd-template)"
    uses: rafatusa/springboot-cicd-template/.github/workflows/enterprise-pipeline.yml@main
    with:
      image_name: "rafatusa/springboot-api"
      java_version: "17"
      aws_region: "us-east-1"
      instance_type: "t3.small"
      health_endpoint: "/actuator/health"
      run_perf_tests: true
      owasp_cvss_threshold: "9"
    secrets: inherit
