---
# nginx_proxy role: install nginx, configure as reverse proxy to app

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: false

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy nginx site config
  ansible.builtin.template:
    src: springboot-api.conf.j2
    dest: /etc/nginx/sites-available/springboot-api.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/springboot-api.conf
    dest: /etc/nginx/sites-enabled/springboot-api.conf
    state: link
  notify: Reload nginx

- name: Test nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Start and enable nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
